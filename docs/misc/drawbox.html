/*    range slider styling    */
        
input[type=range] {
  width: 150px;
  margin: 3px 0;
  background-color: transparent;
  -webkit-appearance: none;
}
input[type=range]:focus {
  outline: none;
}
input[type=range]::-webkit-slider-runnable-track {
  background: #003759;
  border: 0;
  border-radius: 25px;
  width: 100%;
  height: 10px;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  margin-top: -5px;
  width: 34px;
  height: 20px;
  background: #2d7ba6;
  border: 3px solid #00243b;
  border-radius: 5px;
  cursor: pointer;
  -webkit-appearance: none;
}
input[type=range]:focus::-webkit-slider-runnable-track {
  background: #004069;
}
input[type=range]::-moz-range-track {
  background: #003759;
  border: 0;
  border-radius: 25px;
  width: 100%;
  height: 8px;
  cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 34px;
  height: 16px;
  background: #2d7ba6;
  border: 3px solid #00243b;
  border-radius: 5px;
  cursor: pointer;
}
input[type=range]::-ms-track {
  background: transparent;
  border-color: transparent;
  border-width: 6px 0;
  color: transparent;
  width: 100%;
  height: 10px;
  cursor: pointer;
}
input[type=range]::-ms-fill-lower {
  background: #00080d;
  border: 0;
  border-radius: 50px;
}
input[type=range]::-ms-fill-upper {
  background: #00243b;
  border: 0;
  border-radius: 50px;
}
input[type=range]::-ms-thumb {
  width: 34px;
  height: 20px;
  background: #00568c;
  border: 3px solid #00243b;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 0px;
  /*Needed to keep the Edge thumb centred*/
}
input[type=range]:focus::-ms-fill-lower {
  background: #00243b;
}
input[type=range]:focus::-ms-fill-upper {
  background: #004069;
}
/*TODO: Use one of the selectors from https://stackoverflow.com/a/20541859/7077589 and figure out
how to remove the virtical space around the range input in IE*/
@supports (-ms-ime-align:auto) {
  /* Pre-Chromium Edge only styles, selector taken from hhttps://stackoverflow.com/a/32202953/7077589 */
  input[type=range] {
    margin: 0;
    /*Edge starts the margin from the thumb, not the track as other browsers do*/
  }
}

    <div class="TheCanvas">
    <canvas id="drawboxcanvas" width="500px" height="500px"></canvas>
    <br>
    <div onclick="change_color(this)" style="background:red" class="stroke-color"></div>
    <div onclick="change_color(this)" style="background:blue" class="stroke-color"></div>

<!--    canvas options    -->
    <fieldset class="boxed" style="background:none; outline: none;box-shadow: none; padding-top: 0px;border: none; margin-bottom: 0px;">
        <div class="tbox" id="canvasoptions" style="margin: auto;background:url(/images/triangle3-seamless3.jpg); width: 60%; text-align: left; background-size: 80%; background-attachment: fixed; line-height: 40px;">
            
            
    <label for="colorpicker"><strong>Color:  </strong></label>
    <input type="color"  name="colorpicker" id="colorpicker" oninput="stroke_color = this.value; colorchoice.value = this.value"> 

    <label for="StrokeAmount" style="padding-left: 10px;"><strong>Size: </strong></label> <input type="range" id="Strokewidth" name="Strokewidth" min="1" max="100" value="3" oninput="stroke_width = this.value; StrokeAmount.value=this.value" title="stroke width">
    <!--See the stroke value-->
    <output name="StrokeAmount" id="StrokeAmount" for="Stokewidth">3</output>
 

    <br>

                   <label for="OpacityAmount"><strong>Opacity: </strong></label>

                   <input type="range" id="Opacity" name="Opacity" step="0.05" min="0" max="1" value="1" oninput="line_opacity = this.value; OpacityAmount.value=this.value" title="Opacity width">
                   <!--See the stroke value-->

                   <output name="OpacityAmount" id="OpacityAmount" for="Opacity">1.00</output><br>
                   <label for="BrushType"><strong>Brush Type:</strong></label>
                   <select id="BrushType" name="BrushType" oninput="stroke_join = this.value">
                       <option value="round" selected>Round</option>
                       <option value="bevel">Bevel</option>
                       <option value="miter">Miter</option>
                   </select><span> | </span>
                   <label for="LineCap"><strong>Line Cap:</strong></label>
                   <select id="LineCap" name="LineCap" oninput="line_cap = this.value">
                       <option value="round" selected>Round</option>
                       <option value="butt">Butt</option>
                       <option value="square">Square</option>
                   </select>
                   <br>
                   <label for="Name"><strong>Name:</strong></label>
                       <input type="text" oninput="user_name = this.value" required maxlength="30" size="15" placeholder="anonymous">

                   <br>
                <input type="button" id="submit" value="Submit"></input>
